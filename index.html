<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>~/startpage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;700&family=Ubuntu:wght@300;400&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <section class="left">
      <div class="clock">
        <div id="time">--:--</div>
        <div id="date"></div>
      </div>
      <button class="gif" id="gif" type="button" title="Click for another picture">
        <img id="gif-img" alt="Retro animation" width="450" height="400">
      </button>
    </section>

    <section class="right">
      <p class="prompt"><span id="greeting">hello</span>, <button class="accent name-btn" id="name" type="button" title="Click to change your name"></button>
        <span class="path">&gt; cd ~/<span class="cursor">_</span></span></p>

      <form id="search" class="search" autocomplete="off">
        <input id="q" type="text" spellcheck="false" aria-label="Search"
               placeholder="search, or try: !g cats · !b weather · vt 8.8.8.8 · att T1059">
        <div id="hint" class="hint" aria-live="polite"></div>
      </form>

      <nav id="bookmarks" class="bookmarks"></nav>

      <p class="keys"><kbd>/</kbd> search &nbsp;·&nbsp; <kbd>?</kbd> shortcuts &nbsp;·&nbsp; <kbd>esc</kbd> clear</p>
      <div id="help" class="help" hidden></div>
    </section>
  </main>

  <section class="widgets" aria-label="Widgets">
    <article class="card" id="w-weather" aria-label="Weather"></article>
    <article class="card" id="w-zones" aria-label="Time zones"></article>
    <article class="card" id="w-pomo" aria-label="Pomodoro timer"></article>
    <article class="card" id="w-todo" aria-label="Checklist"></article>
  </section>

  <script src="config.js"></script>
  <script src="script.js"></script>
  <script src="widgets.js"></script>
</body>
</html>
